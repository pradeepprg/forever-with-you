<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proposal by Pradeep</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh; 
        }

        #content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            z-index: 2;
        }

        .gif_container img {
            max-width: 250px;
            width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin: 10px 0;
            text-align: center;
        }

        /* Fixed the button container to prevent overlapping */
        .buttons-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* This creates the gap between Yes and No */
            width: 100%;
            min-height: 60px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn { 
            background-color: #ff4d6d; 
            color: white; 
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #noBtn { 
            background-color: #adb5bd; 
            color: white; 
            white-space: nowrap;
            /* Starts relative so it stays next to Yes, goes fixed via JS */
            position: relative; 
            z-index: 100;
        }

        #branding {
            position: fixed;
            bottom: 20px;
            font-size: 0.9rem;
            color: #d63384;
            font-weight: bold;
            text-transform: uppercase;
        }

        #success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-in;
        }

        .success-text {
            color: #d63384;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .heart {
            position: fixed;
            top: -10vh;
            animation: fall 3s linear forwards;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="main-setup">
            <h1 id="question-text">Will you be my forever? 💍</h1>
            <div class="buttons-container">
                <button id="yesBtn" onclick="handleYes()">Yes</button>
                <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <div id="success-screen">
            <div class="gif_container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmZ0Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4JmFjdGlvbj1jbGljayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/KztT2c4u8mYYUiMKdJ/giphy.gif" alt="Happy GIF">
            </div>
            <div class="success-text">I know you are going to accept it! ❤️</div>
        </div>
    </div>

    <div id="branding">Proposal by Pradeep</div>

    <script>
        const prompts = [
            "Are you sure?",
            "Think again!",
            "Really?",
            "Last chance!",
            "Surely not?",
            "You're breaking my heart ;(",
            "Pleaassse?",
            "Change your mind?",
            "Wait, what?",
            "Nice try!"
        ];

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            // On first interaction, switch to fixed positioning
            noBtn.style.position = 'fixed';

            // Change text
            const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            noBtn.innerHTML = randomPrompt;

            // Calculate random position within viewport
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function handleYes() {
            document.getElementById('main-setup').style.display = "none";
            document.getElementById('success-screen').style.display = "flex";
            setInterval(createHeart, 200);
            document.title = "She Said Yes! ❤️";
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 3000);
        }
    </script>
</body>
</html>
